<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>RisuAI CBS 뷰어</title>
<style>
:root {
  font-family: system-ui, "Malgun Gothic", sans-serif;
  color: #edeaf3; background: #13121a;
  --surface: #1d1b27; --edge: #383347; --muted: #b0a8c0;
  --accent: #dcc4ff; --mint: #abefd3;
}
* { box-sizing: border-box; }
body { margin: 0; }
button, textarea { font: inherit; }
main { max-width: 1210px; margin: auto; padding: 34px 24px 56px; }
header { border-bottom: 1px solid var(--edge); padding-bottom: 24px; margin-bottom: 22px; }
.kicker { font: 650 12px ui-monospace, monospace; color: var(--accent); letter-spacing: .17em; }
h1 { font-size: clamp(1.65rem, 4vw, 2.5rem); margin: 7px 0; letter-spacing: -.055em; }
h2 { margin: 0; font-size: 1rem; }
p { margin: 0; color: var(--muted); line-height: 1.55; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.13fr); gap: 16px; align-items: start; }
.editors { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--edge); border-radius: 14px; min-width: 0; }
.editor { padding: 15px; }
.heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; margin-bottom: 10px; }
.hint { font-size: .78rem; color: var(--muted); }
textarea, pre, code { font-family: ui-monospace, "D2Coding", monospace; }
textarea { display: block; width: 100%; resize: vertical; min-height: 6rem; padding: 11px; background: #14131c; color: #edeaf3; border: 1px solid var(--edge); border-radius: 8px; font-size: .84rem; line-height: 1.55; tab-size: 2; }
textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { cursor: pointer; color: var(--accent); background: #2a2438; border: 1px solid #493c5d; border-radius: 7px; padding: 5px 9px; font-size: .78rem; }
button:hover { background: #3b2e50; }
#preview { padding: 15px; }
#status { color: var(--mint); font-size: .8rem; }
#toggle-map { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
#toggle-map:empty, #issues:empty { display: none; }
.mapping { border: 1px solid var(--edge); border-radius: 6px; padding: 3px 7px; font-size: .76rem; overflow-wrap: anywhere; }
.mapping code { color: var(--muted); }
#issues { color: #ffca9f; background: #342820; border: 1px solid #644831; border-radius: 8px; padding: 10px 12px 10px 28px; font-size: .83rem; margin: 0 0 10px; overflow-wrap: anywhere; }
#results { display: grid; gap: 9px; }
.card { background: #171620; border: 1px solid var(--edge); border-radius: 9px; overflow: hidden; }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 9px 10px; border-bottom: 1px solid var(--edge); }
.path > span { overflow-wrap: anywhere; }
.condition { background: #302540; color: var(--accent); border-radius: 5px; padding: 3px 7px; font-size: .83rem; line-height: 1.45; }
.condition.raw { color: #ffceae; background: #35281f; }
.and { color: var(--muted); font-size: .72rem; }
.line { margin-left: auto; flex-shrink: 0; }
pre { color: #f4eff9; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding: 9px 11px; font-size: .85rem; line-height: 1.5; }
.empty { padding: 16px 0; font-size: .88rem; }
#copy-status { margin-top: 8px; }
#copy-status:empty { display: none; }
@media (max-width: 740px) {
  main { padding: 22px 12px 35px; }
  .workspace { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker">RISUAI / CBS</div>
    <h1>CBS 뷰어</h1>
    <p>커스텀 토글에 표시되는 이름과 선택지로 프롬프트의 조건을 읽어요.</p>
  </header>
  <div class="workspace">
    <div class="editors">
      <section class="panel editor">
        <div class="heading"><h2><label for="toggles">커스텀 토글 원문</label></h2><button id="sample" type="button">예시 불러오기</button></div>
        <textarea id="toggles" rows="4" spellcheck="false" autocapitalize="off"></textarea>
        <div id="toggle-map"></div>
      </section>
      <section class="panel editor">
        <div class="heading"><h2><label for="prompt">프롬프트 원문</label></h2><button id="copy" type="button">원문 복사</button></div>
        <textarea id="prompt" rows="20" spellcheck="false" autocapitalize="off"></textarea>
        <p id="copy-status" class="hint" role="status"></p>
      </section>
    </div>
    <section class="panel" id="preview" aria-labelledby="preview-title">
      <div class="heading"><h2 id="preview-title">조건별 출력</h2><span id="status" role="status"></span></div>
      <ul id="issues"></ul>
      <div id="results"></div>
    </section>
  </div>
</main>
<script>
"use strict";

const sampleToggles = `Todayweather=날씨=select=맑음,비,폭우,폭염
daytime=낮
house=집 위치=text`;
const samplePrompt = `{{#when::{{getglobalvar::toggle_Todayweather}}::<=::2}}
{{#when::daytime::is::1}}
A
{{:else}}
{{#when::{{getglobalvar::toggle_house}}::is::충남}}
B
{{/when}}
{{#when::{{getglobalvar::toggle_house}}::is::서울}}
C
{{/when}}
{{/when}}
{{:else}}
{{#when::daytime::is::1}}
D
{{:else}}
F
{{/when}}
{{/when}}`;

function readToggles(source) {
  const toggles = new Map();
  const issues = [];
  source.split(/\r?\n/).forEach((line, index) => {
    if (!line.trim()) return;
    const [key, label, type = "checkbox", ...rest] = line.split("=").map(part => part.trim());
    const options = type === "select" ? rest.join("=").split(",").map(value => value.trim()) : [];
    const validType = ["checkbox", "select", "text", "textarea"].includes(type);
    if (!key || !label || !validType || (type === "select" ? !options.some(Boolean) : rest.length)) {
      issues.push(`토글 ${index + 1}행의 형식을 확인해 주세요.`);
    } else if (toggles.has(key)) {
      issues.push(`토글 ${index + 1}행의 변수명 ${key}이(가) 중복됩니다. 먼저 나온 정의를 사용했어요.`);
    } else {
      toggles.set(key, { label, type, options });
    }
  });
  return { toggles, issues };
}

function scanMacro(source, start) {
  let depth = 1;
  for (let i = start + 2; i < source.length - 1; i++) {
    const pair = source.slice(i, i + 2);
    if (pair === "{{") {
      depth++;
      i++;
    } else if (pair === "}}") {
      depth--;
      if (depth === 0) return i + 2;
      i++;
    }
  }
  return -1;
}

function splitArguments(source) {
  const parts = [];
  let start = 0;
  for (let i = 0; i < source.length - 1; i++) {
    const pair = source.slice(i, i + 2);
    if (pair === "{{") {
      const end = scanMacro(source, i);
      if (end < 0) break;
      i = end - 1;
    } else if (pair === "::") {
      parts.push(source.slice(start, i).trim());
      start = i + 2;
      i++;
    }
  }
  parts.push(source.slice(start).trim());
  return parts;
}

function readPrompt(source) {
  const stack = [];
  const segments = [];
  const issues = [];
  const lineStarts = [0];
  for (let i = 0; i < source.length; i++) if (source[i] === "\n") lineStarts.push(i + 1);
  function lineAt(offset) {
    let low = 0;
    let high = lineStarts.length;
    while (low + 1 < high) {
      const mid = Math.floor((low + high) / 2);
      if (lineStarts[mid] <= offset) low = mid;
      else high = mid;
    }
    return low + 1;
  }
  function emit(start, end) {
    const output = source.slice(start, end);
    const first = output.search(/\S/);
    if (first < 0) return;
    segments.push({ output, path: stack.slice(), offset: start + first, line: lineAt(start + first) });
  }

  let outputStart = 0;
  for (let start = source.indexOf("{{"); start >= 0;) {
    const end = scanMacro(source, start);
    if (end < 0) {
      issues.push(`프롬프트 ${lineAt(start)}행에서 닫는 }}를 찾지 못했어요.`);
      break;
    }
    const body = source.slice(start + 2, end - 2).trim();
    const opens = /^#when(?:\s*::|$)/.test(body);
    if (opens || body === ":else" || body === "/when") {
      emit(outputStart, start);
      outputStart = end;
      if (opens) {
        stack.push({ expression: body.replace(/^#when\s*(?:::)?/, "").trim(), opposite: false, line: lineAt(start) });
      } else if (!stack.length) {
        issues.push(`프롬프트 ${lineAt(start)}행의 {{${body}}}에 대응하는 #when이 없어요.`);
      } else if (body === "/when") {
        stack.pop();
      } else {
        const current = stack[stack.length - 1];
        if (current.opposite) issues.push(`프롬프트 ${lineAt(start)}행에 :else가 중복됐어요.`);
        stack[stack.length - 1] = { ...current, opposite: true };
      }
    }
    start = source.indexOf("{{", end);
  }
  emit(outputStart, source.length);
  for (const frame of stack) issues.push(`프롬프트 ${frame.line}행의 #when에 닫는 태그가 없어요.`);
  return { segments, issues };
}

const comparisons = new Map([
  ["is", { test: (a, b) => a === b, opposite: "isnot" }],
  ["isnot", { test: (a, b) => a !== b, opposite: "is" }],
  ["<", { test: (a, b) => a < b, opposite: ">=" }],
  ["<=", { test: (a, b) => a <= b, opposite: ">" }],
  [">", { test: (a, b) => a > b, opposite: "<=" }],
  [">=", { test: (a, b) => a >= b, opposite: "<" }]
]);

function describe({ expression, opposite }, toggles) {
  const fallback = { text: opposite ? `조건 불충족 · ${expression}` : `조건 · ${expression}`, raw: true };
  const parts = splitArguments(expression);
  if (parts.length !== 3) return fallback;
  const [left, operator, right] = parts;
  const variable = left.match(/^\{\{\s*getglobalvar\s*::\s*toggle_([^{}]+?)\s*\}\}$/);
  const toggle = toggles.get(variable ? variable[1] : left);
  const comparison = comparisons.get(operator);
  if (!toggle || !comparison || /\{\{|\}\}/.test(right)) return fallback;
  const effective = opposite ? comparison.opposite : operator;
  const { label, type, options } = toggle;
  if (type === "text" || type === "textarea") {
    if (!["is", "isnot"].includes(effective)) return fallback;
    return { text: `‘${label}’ 입력값이 ${right ? `‘${right}’` : "빈 문자열"}과 ${effective === "is" ? "같음" : "다름"}` };
  }

  const test = comparisons.get(effective).test;
  const count = type === "checkbox" ? 2 : options.length;
  if (["is", "isnot"].includes(effective) && !/^(0|[1-9]\d*)$/.test(right)) return fallback;
  if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(right) || !Number.isFinite(Number(right))) return fallback;
  const matches = Array.from({ length: count }, (_, index) => index).filter(index => test(index, Number(right)));
  if (matches.length === count) return { text: `‘${label}’ 모든 옵션에서 충족` };
  if (!matches.length) return { text: `‘${label}’ 해당하는 옵션 없음` };
  if (type === "checkbox") return { text: `‘${label}’ ${matches[0] ? "체크됨" : "체크 해제됨"}` };
  const names = matches.map(index => options[index] ? `‘${options[index]}’` : `‘(빈 옵션 · ${index})’`).join(" · ");
  return { text: `‘${label}’가 ${names}${matches.length > 1 ? " 중 하나" : ""}` };
}

const byId = id => document.getElementById(id);
const togglesInput = byId("toggles");
const promptInput = byId("prompt");

function element(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content !== undefined) node.textContent = content;
  return node;
}

function render() {
  const { toggles, issues: toggleIssues } = readToggles(togglesInput.value);
  const { segments, issues: promptIssues } = readPrompt(promptInput.value);
  const mapping = byId("toggle-map");
  const results = byId("results");
  mapping.replaceChildren();
  results.replaceChildren();
  byId("issues").replaceChildren(...[...toggleIssues, ...promptIssues].map(issue => element("li", "", issue)));
  for (const [key, toggle] of toggles) {
    const item = element("span", "mapping", `${toggle.label} ↔ `);
    item.append(element("code", "", key));
    mapping.append(item);
  }
  const visible = promptIssues.length ? [] : segments;
  const branches = visible.filter(segment => segment.path.length).length;
  byId("status").textContent = promptIssues.length ? "구문 확인 필요" : `조건부 출력 ${branches}개`;
  if (!visible.length) {
    results.append(element("p", "empty", promptIssues.length ? "위 구문을 수정하면 결과가 표시돼요." : "프롬프트를 입력하면 여기에 출력이 표시돼요."));
    return;
  }

  const cards = document.createDocumentFragment();
  const descriptions = new Map();
  for (const { output, path, line, offset } of visible) {
    const card = element("article", "card");
    const conditions = element("div", "path");
    if (!path.length) conditions.append(element("span", "condition", "공통 출력"));
    path.forEach((frame, index) => {
      if (!descriptions.has(frame)) descriptions.set(frame, describe(frame, toggles));
      const condition = descriptions.get(frame);
      if (index) conditions.append(element("span", "and", "그리고"));
      const chip = element("span", condition.raw ? "condition raw" : "condition", condition.text);
      chip.title = frame.expression;
      conditions.append(chip);
    });
    const locate = element("button", "line", `${line}행 ↗`);
    locate.type = "button";
    locate.setAttribute("aria-label", `프롬프트 ${line}행으로 이동`);
    locate.addEventListener("click", () => {
      promptInput.focus();
      const lineEnd = promptInput.value.indexOf("\n", offset);
      promptInput.setSelectionRange(offset, lineEnd < 0 ? promptInput.value.length : lineEnd);
      const lineHeight = parseFloat(getComputedStyle(promptInput).lineHeight);
      promptInput.scrollTop = Math.max(0, (line - 2) * lineHeight);
    });
    conditions.append(locate);
    card.append(conditions, element("pre", "", output));
    cards.append(card);
  }
  results.append(cards);
}

function loadSample() {
  if ((togglesInput.value && togglesInput.value !== sampleToggles) ||
      (promptInput.value && promptInput.value !== samplePrompt)) {
    if (!window.confirm("현재 입력을 예시로 바꿀까요?")) return;
  }
  togglesInput.value = sampleToggles;
  promptInput.value = samplePrompt;
  render();
}

let pendingRender;
for (const input of [togglesInput, promptInput]) {
  input.addEventListener("input", () => {
    clearTimeout(pendingRender);
    pendingRender = setTimeout(render, 100);
    byId("copy-status").textContent = "";
  });
}
byId("sample").addEventListener("click", loadSample);
byId("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(promptInput.value);
    byId("copy-status").textContent = "복사했어요.";
  } catch {
    promptInput.focus();
    promptInput.select();
    byId("copy-status").textContent = "선택된 원문을 복사해 주세요.";
  }
});
togglesInput.value = sampleToggles;
promptInput.value = samplePrompt;
render();
</script>
</body>
</html>
