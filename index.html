<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>RisuAI CBS 편집기</title>
<style>
:root {
  font-family: system-ui, "Malgun Gothic", sans-serif;
  color: #302b28;
  background: #f7f2ed;
  --paper: #fffdfa;
  --edge: #dfd4cb;
  --accent: #994c42;
  --blush: #f7e5df;
  --green: #e8eee3;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { padding: clamp(12px, 2.5vw, 28px); display: grid; gap: 16px; }
section { min-width: 0; }
h2 { margin: 0; font-size: 1rem; }
.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
button, textarea { font: inherit; }
button { min-height: 36px; border: 1px solid var(--edge); border-radius: 8px; padding: 5px 10px; background: var(--paper); color: #50453e; cursor: pointer; font-size: .83rem; }
button:hover { background: var(--blush); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#copy { background: #f6e2db; color: #75372d; border-color: #e6c5bb; }
textarea { display: block; width: 100%; border: 1px solid var(--edge); background: #fffcf8; color: inherit; border-radius: 8px; resize: none; overflow: hidden; padding: 10px; font: 1rem/1.55 ui-monospace, "D2Coding", monospace; }
#toggles { min-height: 5rem; resize: vertical; overflow: auto; }
#prompt { min-height: 13rem; }
[hidden], .issues:empty, #copy-status:empty { display: none !important; }
.issues { margin: 0 0 10px; padding: 8px 10px 8px 29px; background: #fbecdb; color: #723b20; border-radius: 8px; font-size: .84rem; overflow-wrap: anywhere; }
#blocks { display: grid; gap: 10px; }
.block { display: grid; min-width: 0; padding: 0; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; background: var(--paper); }
.block > .block { margin-inline-start: 12px; }
.block-label { justify-self: start; }
.condition { background: var(--blush); color: #713d34; border-radius: 5px; padding: 3px 7px; font-size: .84rem; line-height: 1.45; overflow-wrap: anywhere; min-width: 0; }
.block-label.condition { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.condition.raw { color: #704521; background: #f9ecda; }
.common .condition { background: var(--green); color: #3c523e; }
#copy-status { color: #675b53; font-size: .76rem; }
.block > textarea { min-height: 2.9rem; background: var(--paper); margin: 0; border: 0; border-radius: 0; }
.block > textarea:focus-visible { outline-offset: -2px; }
@supports (field-sizing: content) {
  main textarea:not(#toggles) { field-sizing: content; }
}
#copy-status { margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <section aria-labelledby="toggle-title">
    <div class="toolbar"><h2 id="toggle-title"><label for="toggles">커스텀 토글</label></h2></div>
    <textarea id="toggles" autocomplete="off" rows="3" spellcheck="false" autocapitalize="off"></textarea>
  </section>
  <section aria-labelledby="prompt-title">
    <div class="toolbar">
      <h2 id="prompt-title">프롬프트</h2>
      <div class="actions">
        <button id="view" type="button" hidden></button>
        <button id="reload" type="button">새로고침</button>
        <button id="copy" type="button">원문 복사</button>
      </div>
    </div>
    <ul id="prompt-issues" class="issues" aria-live="polite"></ul>
    <textarea id="prompt" autocomplete="off" aria-labelledby="prompt-title" rows="10" spellcheck="false" autocapitalize="off"></textarea>
    <div id="blocks" hidden></div>
    <p id="copy-status" role="status"></p>
  </section>
</main>
<script>
"use strict";

function readToggles(source) {
  const toggles = new Map();
  for (const line of source.split(/\r?\n/)) {
    if (!line.trim()) continue;
    const [key, label, type = "checkbox", ...rest] = line.split("=").map(part => part.trim());
    const options = type === "select" ? rest.join("=").split(",").map(value => value.trim()) : [];
    const validType = ["checkbox", "select", "text", "textarea"].includes(type);
    if (!key || !label || !validType || (type === "select" ? !options.some(Boolean) : rest.length)) continue;
    if (!toggles.has(key)) toggles.set(key, { label, type, options });
  }
  return toggles;
}

function scanMacro(source, start) {
  let depth = 1;
  for (let i = start + 2; i < source.length - 1; i++) {
    const pair = source.slice(i, i + 2);
    if (pair === "{{") {
      depth++;
      i++;
    } else if (pair === "}}") {
      depth--;
      if (depth === 0) return i + 2;
      i++;
    }
  }
  return -1;
}

function splitArguments(source) {
  const parts = [];
  let start = 0;
  for (let i = 0; i < source.length - 1; i++) {
    const pair = source.slice(i, i + 2);
    if (pair === "{{") {
      const end = scanMacro(source, i);
      if (end < 0) break;
      i = end - 1;
    } else if (pair === "::") {
      parts.push(source.slice(start, i).trim());
      start = i + 2;
      i++;
    }
  }
  parts.push(source.slice(start).trim());
  return parts;
}

function readPrompt(source) {
  const stack = [];
  const segments = [];
  const issues = [];
  const lineStarts = [0];
  for (let i = 0; i < source.length; i++) if (source[i] === "\n") lineStarts.push(i + 1);
  function lineAt(offset) {
    let low = 0;
    let high = lineStarts.length;
    while (low + 1 < high) {
      const mid = Math.floor((low + high) / 2);
      if (lineStarts[mid] <= offset) low = mid;
      else high = mid;
    }
    return low + 1;
  }
  function emit(start, end, keepEmpty = false) {
    const output = source.slice(start, end);
    if (!output.trim() && !keepEmpty) return;
    // Keep line breaks beside structural tags in the source, outside the editable body.
    if (start > 0) start += output.match(/^\r?\n/)?.[0].length || 0;
    if (end < source.length) end -= source.slice(start, end).match(/\r?\n$/)?.[0].length || 0;
    segments.push({ start, end, path: stack.filter(frame => frame.condition) });
  }

  let outputStart = 0;
  for (let start = source.indexOf("{{"); start >= 0;) {
    const end = scanMacro(source, start);
    if (end < 0) {
      issues.push(`프롬프트 ${lineAt(start)}행에서 닫는 }}를 찾지 못했어요.`);
      break;
    }
    const rawBody = source.slice(start + 2, end - 2);
    const body = rawBody.trim();
    const frame = stack[stack.length - 1];
    const opens = !frame?.literal && body.match(/^#(when|if_pure|if)(?:([ \t]*::|[ \t]+)([\s\S]*))?$/);
    const closes = rawBody.startsWith("/") && !rawBody.startsWith("//");
    const branches = body === ":else" && (!frame || (frame.tag === "when" && frame.condition.mode !== "legacy"));
    const literal = /^#pure(?:_?display)?$|^#escape/.test(rawBody) || (frame?.literal && rawBody.startsWith("#"));
    // Track non-conditional blocks so their closing tags stay in the editable body.
    if (literal || /^#code$|^#each|^#func /.test(rawBody)) {
      stack.push({ literal });
    } else if (closes && frame && !frame.condition) {
      stack.pop();
    } else if (opens || (closes && (frame || /^\/(?:when|if_pure|if)$/.test(body))) || branches) {
      emit(outputStart, start, !opens && frame?.branchStart === outputStart);
      outputStart = end;
      if (opens) {
        const [, tag, separator, argument = ""] = opens;
        const expression = argument.trim();
        const condition = readCondition(expression, tag === "when" && separator?.trim() === "::");
        stack.push({ tag, expression, condition, opposite: false, line: lineAt(start), branchStart: end });
      } else if (!frame) {
        issues.push("프롬프트 " + lineAt(start) + "행의 {{" + body + "}}에 대응하는 여는 조건 태그가 없어요.");
      } else if (closes) {
        stack.pop();
      } else {
        if (frame.opposite) issues.push("프롬프트 " + lineAt(start) + "행에 :else가 중복됐어요.");
        stack[stack.length - 1] = { ...frame, opposite: true, branchStart: end };
      }
    }
    start = source.indexOf("{{", end);
  }
  emit(outputStart, source.length);
  for (const frame of stack) {
    if (frame.condition) issues.push(`프롬프트 ${frame.line}행의 #${frame.tag}에 닫는 태그가 없어요.`);
  }
  return { segments, issues };
}

const comparisons = new Map([
  ["is", (a, b) => a === b], ["isnot", (a, b) => a !== b],
  ["<", (a, b) => a < b], ["<=", (a, b) => a <= b],
  [">", (a, b) => a > b], [">=", (a, b) => a >= b]
]);
const macroComparisons = new Map([
  ["equal", "is"], ["notequal", "isnot"], ["not_equal", "isnot"],
  ["greater", ">"], ["less", "<"],
  ["greaterequal", ">="], ["greater_equal", ">="], ["lessequal", "<="], ["less_equal", "<="]
]);
const binaryOperators = new Set(["and", "or", "tis", "tisnot", "vis", "visnot", ...comparisons.keys()]);
const value = text => ({ text });
const operation = (op, args, macro = false) => ({ op, args, macro });

const calcComparisons = new Map([
  ["=", "is"], ["==", "is"], ["!=", "isnot"], ["≠", "isnot"],
  ["<", "<"], ["<=", "<="], ["≤", "<="], [">", ">"], [">=", ">="], ["≥", ">="]
]);
const calcComparison = /^(\{\{\s*(?:getglobalvar|getvar)\s*::[^{}]+\}\}|[$@][a-zA-Z0-9_]+|-?(?:\d+(?:\.\d*)?|\.\d+))\s*(==|!=|<=|>=|[=≠<>≤≥])\s*(\{\{\s*(?:getglobalvar|getvar)\s*::[^{}]+\}\}|[$@][a-zA-Z0-9_]+|-?(?:\d+(?:\.\d*)?|\.\d+))$/;

function readCalcComparison(expression) {
  let formula = expression.trim();
  while (formula.startsWith("(") && formula.endsWith(")")) {
    formula = formula.slice(1, -1).trim();
  }
  const match = formula.match(calcComparison);
  if (!match) return null;
  const [, left, operator, right] = match;
  const args = [left, right].map(text => {
    if (text[0] === "$" || text[0] === "@") {
      const getter = text[0] === "$" ? "getvar" : "getglobalvar";
      return value("{{" + getter + "::" + text.slice(1) + "}}");
    }
    return value(text);
  });
  // The RisuAI calculator recognizes a zero literal only when it is spelled 0.
  if (args.some(arg => Number(arg.text) === 0 && arg.text !== "0")) return null;
  return { ...operation(calcComparisons.get(operator), args, true), numeric: true };
}

function readOperand(text) {
  if (!text.startsWith("{{") || scanMacro(text, 0) !== text.length) return value(text);
  const body = text.slice(2, -2);
  if (body.startsWith("? ")) return readCalcComparison(body.slice(2)) ?? { text, raw: true };
  const [name, ...args] = splitArguments(body);
  if (name === "calc" && args.length === 1) {
    return readCalcComparison(args[0]) ?? { text, raw: true };
  }
  const op = macroComparisons.get(name) || name;
  if ((op === "not" && args.length === 1) ||
      ((comparisons.has(op) || op === "and" || op === "or") && args.length === 2)) {
    return operation(op, args.map(readOperand), true);
  }
  return value(text);
}

function readCondition(expression, useOperators) {
  if (!useOperators) return { node: readOperand(expression) };
  const tokens = splitArguments(expression);
  let mode;
  let node = readOperand(tokens.pop());
  // RisuAI reduces #when operands starting at the right edge.
  while (tokens.length) {
    const op = tokens.pop();
    if (op === "keep" || op === "legacy") {
      mode = op;
    } else if (op === "not" || op === "toggle" || op === "var") {
      node = operation(op, [node]);
    } else if (tokens.length && binaryOperators.has(op)) {
      node = operation(op, [readOperand(tokens.pop()), node]);
    } else {
      return { node: null, mode };
    }
  }
  return { node, mode };
}

const quote = text => text === "" ? "빈 문자열" : "‘" + text + "’";
const isLiteral = node => node.text !== undefined && !node.text.includes("{{");

function hasFinalConsonant(text) {
  const last = text.replace(/’$/, "").slice(-1).charCodeAt(0);
  return last >= 0xac00 && last <= 0xd7a3 && (last - 0xac00) % 28 !== 0;
}

function reference(node, toggles, kind) {
  const text = node.text;
  if (text === undefined) return null;
  if (kind === "chat") return isLiteral(node) ? { name: "채팅 변수 " + quote(text) } : null;
  if (kind === "toggle" && !isLiteral(node)) return null;
  const macro = text.match(/^\{\{\s*(getglobalvar|getvar)\s*::\s*([^{}]+?)\s*\}\}$/);
  const key = kind === "toggle" && isLiteral(node) ? text
    : macro?.[1] === "getglobalvar" && macro[2].startsWith("toggle_") ? macro[2].slice(7)
    : !kind && toggles.has(text) ? text
    : null;
  if (key !== null) {
    const toggle = toggles.get(key);
    return { name: quote(toggle?.label ?? key), toggle };
  }
  if (macro) {
    return { name: (macro[1] === "getvar" ? "채팅 변수 " : "전역 변수 ") + quote(macro[2]) };
  }
  return null;
}

function describeOptions(ref, test) {
  const { name, toggle } = ref;
  const checkbox = toggle.type === "checkbox";
  const count = checkbox ? 2 : toggle.options.length;
  const matches = Array.from({ length: count }, (_, index) => index).filter(test);
  if (matches.length === count) return name + " 모든 옵션에서 충족";
  if (!matches.length) return name + " 해당하는 옵션 없음";
  if (checkbox) return name + (matches[0] ? " 체크됨" : " 체크 해제됨");
  const names = matches.map(index => quote(toggle.options[index] || "(빈 옵션 · " + index + ")")).join(" · ");
  return name + (hasFinalConsonant(name) ? "이 " : "가 ") + names + (matches.length > 1 ? " 중 하나" : "");
}

function describeTruth(node, toggles, opposite, exactOne = false, kind) {
  const ref = reference(node, toggles, kind);
  if (ref?.toggle && ["checkbox", "select"].includes(ref.toggle.type)) {
    return describeOptions(ref, index => (index === 1) !== opposite);
  }
  const name = ref?.name ?? describeValue(node, toggles, kind);
  if (!ref && !kind && ["0", "1", "true", "false"].includes(node.text)) {
    const truthy = node.text === "1" || (!exactOne && node.text === "true");
    return truthy !== opposite ? "항상 충족" : "항상 불충족";
  }
  const expected = exactOne ? "1" : "1 또는 true";
  return name + " 값이 " + expected + (opposite ? "에 해당하지 않음" : "에 해당함");
}

function describeValue(node, toggles, kind) {
  const text = node.text ?? "(" + describeExpression(node, toggles) + ")";
  if (kind === "toggle") return "토글 " + text;
  if (kind === "chat") return "채팅 변수 " + text;
  return text;
}

function describeComparison(node, toggles, opposite) {
  let [left, right] = node.args;
  let operator = node.op;
  if (node.numeric && isLiteral(left) && !isLiteral(right)) {
    [left, right] = [right, left];
    operator = { "<": ">", "<=": ">=", ">": "<", ">=": "<=" }[operator] || operator;
  }
  const kind = node.op.startsWith("tis") ? "toggle" : node.op.startsWith("vis") ? "chat" : undefined;
  const op = kind ? (node.op.endsWith("not") ? "isnot" : "is") : operator;
  const test = comparisons.get(op);
  const ref = reference(left, toggles, kind);
  const literal = isLiteral(right);
  const equality = op === "is" || op === "isnot";
  if (ref?.toggle && ["checkbox", "select"].includes(ref.toggle.type) && literal) {
    const number = node.macro ? Number(right.text) : parseFloat(right.text);
    return describeOptions(ref, index => (equality && !node.numeric
      ? test(String(index), right.text)
      : test(index, number)) !== opposite);
  }

  const a = ref?.name ?? describeValue(left, toggles, kind);
  const b = literal ? quote(right.text)
    : reference(right, toggles)?.name ?? describeValue(right, toggles);
  if (equality && !node.numeric) {
    const particle = hasFinalConsonant(b) ? "과" : "와";
    const result = (op === "is") !== opposite ? " 같음" : " 다름";
    return a + (ref?.toggle ? " 입력값이 " : " 값이 ") + b + particle + result;
  }
  const symbol = { is: "=", isnot: "≠" }[op] || op;
  const condition = a + " " + symbol + " " + b;
  return opposite ? "조건 불충족 · (" + condition + ")" : condition;
}

function describeExpression(node, toggles, opposite = false, exactOne = false, nested = false) {
  const { op, args, macro } = node;
  if (!op) return describeTruth(node, toggles, opposite, exactOne);
  if (op === "not") return describeExpression(args[0], toggles, !opposite, macro, nested);
  if (op === "toggle" || op === "var") {
    return describeTruth(args[0], toggles, opposite, false, op === "var" ? "chat" : "toggle");
  }
  if (op === "and" || op === "or") {
    const joiner = (op === "and") !== opposite ? " 그리고 " : " 또는 ";
    const text = args.map(arg => describeExpression(arg, toggles, opposite, macro, true)).join(joiner);
    return nested ? "(" + text + ")" : text;
  }
  return describeComparison(node, toggles, opposite);
}

function describe({ expression, opposite, condition }, toggles) {
  return condition.node && !condition.node.raw
    ? { text: describeExpression(condition.node, toggles, opposite) }
    : { text: (opposite ? "조건 불충족 · " : "조건 · ") + expression, raw: true };
}

const byId = id => document.getElementById(id);
const togglesInput = byId("toggles");
const promptInput = byId("prompt");
const blocks = byId("blocks");
const view = byId("view");
const copyStatus = byId("copy-status");
const reloadDraftKey = "risu-cbs:reload:" + location.pathname;
const nativeFieldSizing = CSS.supports("field-sizing", "content");
let toggles = new Map();
let blockSource = "";
let editors = [];
const conditionBlocks = new Map();
let editingRaw = false;
let pendingRender;

function fitTextarea(input) {
  if (nativeFieldSizing || input === togglesInput || !input.getClientRects().length) return;
  input.style.height = "0px";
  const borderHeight = input.offsetHeight - input.clientHeight;
  input.style.height = input.scrollHeight + borderHeight + "px";
}

function element(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content !== undefined) node.textContent = content;
  return node;
}

function showIssues(id, issues) {
  byId(id).replaceChildren(...issues.map(issue => element("li", "", issue)));
}

function labelCondition(block, frame) {
  const condition = describe(frame, toggles);
  const label = block.firstElementChild;
  label.classList.toggle("raw", !!condition.raw);
  label.textContent = condition.text;
  label.title = frame.expression;
  block.setAttribute("aria-label", condition.text);
}

function appendBlock(parent, frame) {
  const block = element("div", frame ? "block" : "block common");
  block.append(element("span", "block-label condition", frame ? "" : "공통"));
  if (frame) {
    block.setAttribute("role", "group");
    conditionBlocks.set(frame, block);
    labelCondition(block, frame);
  }
  parent.append(block);
  return block;
}

function updateToggles() {
  toggles = readToggles(togglesInput.value);
  conditionBlocks.forEach(labelCondition);
}

function collectSource(source, fields) {
  const parts = [];
  let offset = 0;
  for (const { start, end, input } of fields) {
    parts.push(source.slice(offset, start), input.value);
    offset = end;
  }
  parts.push(source.slice(offset));
  return parts.join("");
}

function currentSource() {
  return blocks.hidden ? promptInput.value : collectSource(blockSource, editors);
}

function showBlocks({ force = false, moveFocus = false } = {}) {
  clearTimeout(pendingRender);
  const source = promptInput.value;
  const { segments, issues } = readPrompt(source);
  showIssues("prompt-issues", issues);
  if (issues.length) return;
  if (!segments.some(segment => segment.path.length)) {
    if (force) {
      editingRaw = false;
      view.hidden = true;
      promptInput.focus();
    }
    return;
  }
  if (editingRaw && !force) return;

  const selection = promptInput.selectionEnd;
  blockSource = source;
  const content = document.createDocumentFragment();
  conditionBlocks.clear();
  editors = segments.map(segment => {
    const { start, end, path } = segment;
    let parent = content;
    for (const frame of path) {
      parent = conditionBlocks.get(frame) || appendBlock(parent, frame);
    }
    if (!path.length) parent = appendBlock(content);

    const input = element("textarea");
    input.value = source.slice(start, end);
    input.rows = Math.min(8, input.value.split("\n").length);
    input.spellcheck = false;
    input.autocapitalize = "off";
    input.setAttribute("aria-label", path.length ? "프롬프트 본문" : "공통 프롬프트");
    parent.append(input);
    return { start, end, input };
  });
  blocks.replaceChildren(content);
  promptInput.hidden = true;
  blocks.hidden = false;
  editors.forEach(({ input }) => fitTextarea(input));
  view.hidden = false;
  view.textContent = "CBS 편집";
  editingRaw = false;

  if (moveFocus) {
    const editor = editors.find(item => item.end >= selection) || editors[editors.length - 1];
    const caret = Math.max(0, Math.min(selection - editor.start, editor.input.value.length));
    editor.input.focus();
    editor.input.setSelectionRange(caret, caret);
  }
}

if (!nativeFieldSizing) {
  const main = document.querySelector("main");
  main.addEventListener("input", event => fitTextarea(event.target));
  let previousWidth;
  new ResizeObserver(([entry]) => {
    const width = entry.contentRect.width;
    if (width === previousWidth) return;
    previousWidth = width;
    main.querySelectorAll("textarea").forEach(fitTextarea);
  }).observe(main);
}

togglesInput.addEventListener("input", updateToggles);
promptInput.addEventListener("input", () => {
  clearTimeout(pendingRender);
  copyStatus.textContent = "";
  pendingRender = setTimeout(() => showBlocks({ moveFocus: document.activeElement === promptInput }), 180);
});
blocks.addEventListener("input", () => { copyStatus.textContent = ""; });

view.addEventListener("click", () => {
  if (blocks.hidden) {
    showBlocks({ force: true });
    return;
  }
  promptInput.value = currentSource();
  editors = [];
  conditionBlocks.clear();
  blocks.replaceChildren();
  blocks.hidden = true;
  promptInput.hidden = false;
  fitTextarea(promptInput);
  editingRaw = true;
  view.textContent = "블록 보기";
  promptInput.focus();
});

byId("copy").addEventListener("click", async () => {
  const source = currentSource();
  try {
    await navigator.clipboard.writeText(source);
  } catch {
    const previous = document.activeElement;
    const temporary = element("textarea");
    temporary.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    temporary.value = source;
    document.body.append(temporary);
    temporary.select();
    let copied = false;
    try {
      copied = document.execCommand("copy");
    } catch {
      copied = false;
    } finally {
      temporary.remove();
      previous?.focus();
    }
    if (!copied) {
      copyStatus.textContent = "복사할 수 없어요.";
      return;
    }
  }
  copyStatus.textContent = "복사했어요.";
});
byId("reload").addEventListener("click", () => {
  try {
    sessionStorage.setItem(reloadDraftKey, JSON.stringify({
      toggles: togglesInput.value,
      prompt: currentSource()
    }));
  } catch {
    copyStatus.textContent = "입력을 보관할 수 없어 새로고침을 멈췄어요.";
    return;
  }
  location.reload();
});

function restoreReloadDraft() {
  let draft;
  try {
    draft = JSON.parse(sessionStorage.getItem(reloadDraftKey));
  } catch {
    return;
  }
  if (typeof draft?.toggles !== "string" || typeof draft.prompt !== "string") return;
  togglesInput.value = draft.toggles;
  promptInput.value = draft.prompt;
  updateToggles();
  fitTextarea(promptInput);
  showBlocks();
  sessionStorage.removeItem(reloadDraftKey);
}

restoreReloadDraft();
</script>
</body>
</html>
