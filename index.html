<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>RisuAI CBS 편집기</title>
<style>
:root {
  font-family: system-ui, "Malgun Gothic", sans-serif;
  color: #302b28;
  background: #f7f2ed;
  --paper: #fffdfa;
  --edge: #dfd4cb;
  --accent: #994c42;
  --blush: #f7e5df;
  --green: #e8eee3;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { padding: clamp(12px, 2.5vw, 28px); display: grid; gap: 16px; }
section { min-width: 0; }
h2 { margin: 0; font-size: 1rem; }
.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
button, textarea { font: inherit; }
button { min-height: 36px; border: 1px solid var(--edge); border-radius: 8px; padding: 5px 10px; background: var(--paper); color: #50453e; cursor: pointer; font-size: .83rem; }
button:hover { background: var(--blush); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#copy { background: #f6e2db; color: #75372d; border-color: #e6c5bb; }
textarea { display: block; width: 100%; border: 1px solid var(--edge); background: #fffcf8; color: inherit; border-radius: 8px; resize: none; overflow: hidden; padding: 10px; font: 1rem/1.55 ui-monospace, "D2Coding", monospace; }
#toggles { min-height: 5rem; }
#prompt { min-height: 13rem; }
[hidden], .issues:empty, #copy-status:empty { display: none !important; }
.issues { margin: 0 0 10px; padding: 8px 10px 8px 29px; background: #fbecdb; color: #723b20; border-radius: 8px; font-size: .84rem; overflow-wrap: anywhere; }
#blocks { display: grid; gap: 10px; }
.block { display: grid; gap: 8px; min-width: 0; border: 1px solid var(--edge); border-radius: 9px; background: #fffcf8; padding: 9px; }
.block-label { justify-self: start; }
.condition { background: var(--blush); color: #713d34; border-radius: 5px; padding: 3px 7px; font-size: .84rem; line-height: 1.45; overflow-wrap: anywhere; min-width: 0; }
.condition.raw { color: #704521; background: #f9ecda; }
.common .condition { background: var(--green); color: #3c523e; }
#copy-status { color: #675b53; font-size: .76rem; }
.block textarea { min-height: 2.9rem; background: var(--paper); }
@supports (field-sizing: content) {
  main textarea { field-sizing: content; }
}
#copy-status { margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <section aria-labelledby="toggle-title">
    <div class="toolbar"><h2 id="toggle-title"><label for="toggles">커스텀 토글</label></h2></div>
    <textarea id="toggles" rows="3" spellcheck="false" autocapitalize="off"></textarea>
  </section>
  <section aria-labelledby="prompt-title">
    <div class="toolbar">
      <h2 id="prompt-title">프롬프트</h2>
      <div class="actions">
        <button id="view" type="button" hidden></button>
        <button id="copy" type="button">원문 복사</button>
      </div>
    </div>
    <ul id="prompt-issues" class="issues" aria-live="polite"></ul>
    <textarea id="prompt" aria-labelledby="prompt-title" rows="10" spellcheck="false" autocapitalize="off"></textarea>
    <div id="blocks" hidden></div>
    <p id="copy-status" role="status"></p>
  </section>
</main>
<script>
"use strict";

function readToggles(source) {
  const toggles = new Map();
  for (const line of source.split(/\r?\n/)) {
    if (!line.trim()) continue;
    const [key, label, type = "checkbox", ...rest] = line.split("=").map(part => part.trim());
    const options = type === "select" ? rest.join("=").split(",").map(value => value.trim()) : [];
    const validType = ["checkbox", "select", "text", "textarea"].includes(type);
    if (!key || !label || !validType || (type === "select" ? !options.some(Boolean) : rest.length)) continue;
    if (!toggles.has(key)) toggles.set(key, { label, type, options });
  }
  return toggles;
}

function scanMacro(source, start) {
  let depth = 1;
  for (let i = start + 2; i < source.length - 1; i++) {
    const pair = source.slice(i, i + 2);
    if (pair === "{{") {
      depth++;
      i++;
    } else if (pair === "}}") {
      depth--;
      if (depth === 0) return i + 2;
      i++;
    }
  }
  return -1;
}

function splitArguments(source) {
  const parts = [];
  let start = 0;
  for (let i = 0; i < source.length - 1; i++) {
    const pair = source.slice(i, i + 2);
    if (pair === "{{") {
      const end = scanMacro(source, i);
      if (end < 0) break;
      i = end - 1;
    } else if (pair === "::") {
      parts.push(source.slice(start, i).trim());
      start = i + 2;
      i++;
    }
  }
  parts.push(source.slice(start).trim());
  return parts;
}

function readPrompt(source) {
  const stack = [];
  const segments = [];
  const issues = [];
  const lineStarts = [0];
  for (let i = 0; i < source.length; i++) if (source[i] === "\n") lineStarts.push(i + 1);
  function lineAt(offset) {
    let low = 0;
    let high = lineStarts.length;
    while (low + 1 < high) {
      const mid = Math.floor((low + high) / 2);
      if (lineStarts[mid] <= offset) low = mid;
      else high = mid;
    }
    return low + 1;
  }
  function emit(start, end, keepEmpty = false) {
    const output = source.slice(start, end);
    if (!output.trim() && !keepEmpty) return;
    // Keep line breaks beside structural tags in the source, outside the editable body.
    if (start > 0) start += output.match(/^\r?\n/)?.[0].length || 0;
    if (end < source.length) end -= source.slice(start, end).match(/\r?\n$/)?.[0].length || 0;
    segments.push({ start, end, path: stack.slice() });
  }

  let outputStart = 0;
  for (let start = source.indexOf("{{"); start >= 0;) {
    const end = scanMacro(source, start);
    if (end < 0) {
      issues.push(`프롬프트 ${lineAt(start)}행에서 닫는 }}를 찾지 못했어요.`);
      break;
    }
    const body = source.slice(start + 2, end - 2).trim();
    const opens = /^#when(?:\s*::|$)/.test(body);
    if (opens || body === ":else" || body === "/when") {
      const frame = stack[stack.length - 1];
      emit(outputStart, start, !opens && frame?.branchStart === outputStart);
      outputStart = end;
      if (opens) {
        stack.push({ expression: body.replace(/^#when\s*(?:::)?/, "").trim(), opposite: false, line: lineAt(start), branchStart: end });
      } else if (!stack.length) {
        issues.push(`프롬프트 ${lineAt(start)}행의 {{${body}}}에 대응하는 #when이 없어요.`);
      } else if (body === "/when") {
        stack.pop();
      } else {
        const current = stack[stack.length - 1];
        if (current.opposite) issues.push(`프롬프트 ${lineAt(start)}행에 :else가 중복됐어요.`);
        stack[stack.length - 1] = { ...current, opposite: true, branchStart: end };
      }
    }
    start = source.indexOf("{{", end);
  }
  emit(outputStart, source.length);
  for (const frame of stack) issues.push(`프롬프트 ${frame.line}행의 #when에 닫는 태그가 없어요.`);
  return { segments, issues };
}

const comparisons = new Map([
  ["is", { test: (a, b) => a === b, opposite: "isnot" }],
  ["isnot", { test: (a, b) => a !== b, opposite: "is" }],
  ["<", { test: (a, b) => a < b, opposite: ">=" }],
  ["<=", { test: (a, b) => a <= b, opposite: ">" }],
  [">", { test: (a, b) => a > b, opposite: "<=" }],
  [">=", { test: (a, b) => a >= b, opposite: "<" }]
]);

function describe({ expression, opposite }, toggles) {
  const fallback = { text: opposite ? `조건 불충족 · ${expression}` : `조건 · ${expression}`, raw: true };
  const parts = splitArguments(expression);
  if (parts.length !== 3) return fallback;
  const [left, operator, right] = parts;
  const variable = left.match(/^\{\{\s*getglobalvar\s*::\s*toggle_([^{}]+?)\s*\}\}$/);
  const toggle = toggles.get(variable ? variable[1] : left);
  const comparison = comparisons.get(operator);
  if (!toggle || !comparison || /\{\{|\}\}/.test(right)) return fallback;
  const effective = opposite ? comparison.opposite : operator;
  const { label, type, options } = toggle;
  if (type === "text" || type === "textarea") {
    if (!["is", "isnot"].includes(effective)) return fallback;
    return { text: `‘${label}’ 입력값이 ${right ? `‘${right}’` : "빈 문자열"}과 ${effective === "is" ? "같음" : "다름"}` };
  }

  const test = comparisons.get(effective).test;
  const count = type === "checkbox" ? 2 : options.length;
  if (["is", "isnot"].includes(effective) && !/^(0|[1-9]\d*)$/.test(right)) return fallback;
  if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(right) || !Number.isFinite(Number(right))) return fallback;
  const matches = Array.from({ length: count }, (_, index) => index).filter(index => test(index, Number(right)));
  if (matches.length === count) return { text: `‘${label}’ 모든 옵션에서 충족` };
  if (!matches.length) return { text: `‘${label}’ 해당하는 옵션 없음` };
  if (type === "checkbox") return { text: `‘${label}’ ${matches[0] ? "체크됨" : "체크 해제됨"}` };
  const names = matches.map(index => options[index] ? `‘${options[index]}’` : `‘(빈 옵션 · ${index})’`).join(" · ");
  return { text: `‘${label}’가 ${names}${matches.length > 1 ? " 중 하나" : ""}` };
}

const byId = id => document.getElementById(id);
const togglesInput = byId("toggles");
const promptInput = byId("prompt");
const blocks = byId("blocks");
const view = byId("view");
const copyStatus = byId("copy-status");
const nativeFieldSizing = CSS.supports("field-sizing", "content");
let toggles = new Map();
let blockSource = "";
let editors = [];
const conditionBlocks = new Map();
let editingRaw = false;
let pendingRender;

function fitTextarea(input) {
  if (nativeFieldSizing || !input.getClientRects().length) return;
  input.style.height = "0px";
  const borderHeight = input.offsetHeight - input.clientHeight;
  input.style.height = input.scrollHeight + borderHeight + "px";
}

function element(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content !== undefined) node.textContent = content;
  return node;
}

function showIssues(id, issues) {
  byId(id).replaceChildren(...issues.map(issue => element("li", "", issue)));
}

function labelCondition(block, frame) {
  const condition = describe(frame, toggles);
  const label = block.firstElementChild;
  label.classList.toggle("raw", !!condition.raw);
  label.textContent = condition.text;
  label.title = frame.expression;
  block.setAttribute("aria-label", condition.text);
}

function appendBlock(parent, frame) {
  const block = element("div", frame ? "block" : "block common");
  block.append(element("span", "block-label condition", frame ? "" : "공통"));
  if (frame) {
    block.setAttribute("role", "group");
    conditionBlocks.set(frame, block);
    labelCondition(block, frame);
  }
  parent.append(block);
  return block;
}

function updateToggles() {
  toggles = readToggles(togglesInput.value);
  conditionBlocks.forEach(labelCondition);
}

function collectSource(source, fields) {
  const parts = [];
  let offset = 0;
  for (const { start, end, input } of fields) {
    parts.push(source.slice(offset, start), input.value);
    offset = end;
  }
  parts.push(source.slice(offset));
  return parts.join("");
}

function currentSource() {
  return blocks.hidden ? promptInput.value : collectSource(blockSource, editors);
}

function showBlocks({ force = false, moveFocus = false } = {}) {
  clearTimeout(pendingRender);
  const source = promptInput.value;
  const { segments, issues } = readPrompt(source);
  showIssues("prompt-issues", issues);
  if (issues.length) return;
  if (!segments.some(segment => segment.path.length)) {
    if (force) {
      editingRaw = false;
      view.hidden = true;
      promptInput.focus();
    }
    return;
  }
  if (editingRaw && !force) return;

  const selection = promptInput.selectionEnd;
  blockSource = source;
  const content = document.createDocumentFragment();
  conditionBlocks.clear();
  editors = segments.map(segment => {
    const { start, end, path } = segment;
    let parent = content;
    for (const frame of path) {
      parent = conditionBlocks.get(frame) || appendBlock(parent, frame);
    }
    if (!path.length) parent = appendBlock(content);

    const input = element("textarea");
    input.value = source.slice(start, end);
    input.rows = Math.min(8, input.value.split("\n").length);
    input.spellcheck = false;
    input.autocapitalize = "off";
    input.setAttribute("aria-label", path.length ? "프롬프트 본문" : "공통 프롬프트");
    parent.append(input);
    return { start, end, input };
  });
  blocks.replaceChildren(content);
  promptInput.hidden = true;
  blocks.hidden = false;
  editors.forEach(({ input }) => fitTextarea(input));
  view.hidden = false;
  view.textContent = "CBS 편집";
  editingRaw = false;

  if (moveFocus) {
    const editor = editors.find(item => item.end >= selection) || editors[editors.length - 1];
    const caret = Math.max(0, Math.min(selection - editor.start, editor.input.value.length));
    editor.input.focus();
    editor.input.setSelectionRange(caret, caret);
  }
}

if (!nativeFieldSizing) {
  const main = document.querySelector("main");
  main.addEventListener("input", event => fitTextarea(event.target));
  let previousWidth;
  new ResizeObserver(([entry]) => {
    const width = entry.contentRect.width;
    if (width === previousWidth) return;
    previousWidth = width;
    main.querySelectorAll("textarea").forEach(fitTextarea);
  }).observe(main);
}

togglesInput.addEventListener("input", updateToggles);
promptInput.addEventListener("input", () => {
  clearTimeout(pendingRender);
  copyStatus.textContent = "";
  pendingRender = setTimeout(() => showBlocks({ moveFocus: document.activeElement === promptInput }), 180);
});
blocks.addEventListener("input", () => { copyStatus.textContent = ""; });

view.addEventListener("click", () => {
  if (blocks.hidden) {
    showBlocks({ force: true });
    return;
  }
  promptInput.value = currentSource();
  editors = [];
  conditionBlocks.clear();
  blocks.replaceChildren();
  blocks.hidden = true;
  promptInput.hidden = false;
  fitTextarea(promptInput);
  editingRaw = true;
  view.textContent = "블록 보기";
  promptInput.focus();
});

byId("copy").addEventListener("click", async () => {
  const source = currentSource();
  try {
    await navigator.clipboard.writeText(source);
  } catch {
    const previous = document.activeElement;
    const temporary = element("textarea");
    temporary.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    temporary.value = source;
    document.body.append(temporary);
    temporary.select();
    let copied = false;
    try {
      copied = document.execCommand("copy");
    } catch {
      copied = false;
    } finally {
      temporary.remove();
      previous?.focus();
    }
    if (!copied) {
      copyStatus.textContent = "복사할 수 없어요.";
      return;
    }
  }
  copyStatus.textContent = "복사했어요.";
});
</script>
</body>
</html>
